apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-flask-demo
  labels:
    app: argocd-flask-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-flask-demo
  template:
    metadata:
      labels:
        app: argocd-flask-demo
    spec:
      containers:
        - name: app
          image: argocd-flask-demo:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
